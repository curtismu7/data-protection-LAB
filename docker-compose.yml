# OrbStack:  HOST_PORT=7200 docker compose up --build -d   ->  http://127.0.0.1:7200
# The server binds 0.0.0.0 INSIDE the container (DPLAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7200-7249. DPL_LAB_MODE=live opens the page in Live mode
# (still loopback, no outbound). Mock is the default.
name: data-protection-lab

services:
  data-protection-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7200}:7200"
    environment:
      PORT: "7200"
      DPLAB_BIND: 0.0.0.0
      DPL_LAB_MODE: ${DPL_LAB_MODE:-mock}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-data-protection-lab.local.ping-devops.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7200/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
